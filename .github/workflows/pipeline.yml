# Workflow for deploying WasmJS App to GitHub Pages
name: Deploy WasmJS App to GitHub Pages

on:
  push:
    branches:
      - main  # Trigger the workflow on pushes to the main branch
  workflow_dispatch:  # Allow manual triggering
  schedule:
    - cron: "*/15 * * * *"  # Refresh snapshot every 15 minutes (UTC)

permissions:
  contents: read  # Required to fetch the repository content
  pages: write    # Allow deployment to GitHub Pages
  id-token: write # Required by actions/configure-pages

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repository
      - name: "✅ Checkout code"
        uses: actions/checkout@v4

      # 2. Set up JDK
      - name: "⚙️ Set up JDK"
        uses: actions/setup-java@v5
        with:
          distribution: 'jetbrains'
          java-version: '21'

      # 3. Set up Gradle
      - name: "⚙️ Setup Gradle"
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 8.14.3

      # 4. Refresh Meetup snapshot (runtime data source)
      - name: "📡 Refresh Meetup snapshot"
        run: python3 scripts/fetch_meetup_snapshot.py --url https://www.meetup.com/kobudei/ --output composeApp/src/webMain/resources/meetup-snapshot.properties

      # 5. Build the WasmJS App
      - name: "🛠️ Build WasmJS App"
        run: gradle :composeApp:wasmJsBrowserDistribution

      # 6. Set up GitHub Pages
      - name: "📄 Configure GitHub Pages"
        uses: actions/configure-pages@v5

      # 7. Upload the built artifact to Pages
      - name: "📤 Upload GitHub Pages artifact"
        uses: actions/upload-pages-artifact@v3
        with:
          path: composeApp/build/dist/wasmJs/productionExecutable

      # 8. Deploy to GitHub Pages
      - name: "🚀 Deploy to GitHub Pages"
        id: deployment
        uses: actions/deploy-pages@v4
