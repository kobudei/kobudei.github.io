<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kobudei | Kotlin Community Bucharest</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Sora:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link type="text/css" rel="stylesheet" href="styles.css">
</head>
<body>
<div id="boot-loader" aria-label="Loading website">
    <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 50 50" role="presentation">
        <circle cx="25" cy="25" r="20" stroke="#30426a" stroke-width="4" fill="none"/>
        <circle cx="25" cy="25" r="20" stroke="#3fe7d0" stroke-width="4" fill="none" stroke-linecap="round"
                stroke-dasharray="90 125">
            <animateTransform attributeName="transform" type="rotate" from="0 25 25" to="360 25 25" dur="1s"
                              repeatCount="indefinite"/>
        </circle>
    </svg>
</div>
<script>
    window.addEventListener("DOMContentLoaded", () => {
        const loader = document.getElementById("boot-loader");
        if (!loader) return;

        const clearLoader = () => {
            if (loader.isConnected) {
                loader.remove();
            }
        };

        const observer = new MutationObserver(() => {
            if (document.querySelector("canvas")) {
                clearLoader();
                observer.disconnect();
            }
        });

        observer.observe(document.body, {childList: true, subtree: true});
        setTimeout(() => {
            clearLoader();
            observer.disconnect();
        }, 6000);
    });
</script>
<script type="application/javascript" src="composeApp.js"></script>
</body>
</html>
